name: gruvbox-plus-icon-theme
title: Gruvbox Plus Icon Theme
adopt-info: icons
summary: Gruvbox Plus is the icon pack for Linux
description: |
  Gruvbox Plus is the icon pack for Linux, based on and inspired by Suru++, OneDark, 
  Gruvbox icon pack, GruvboxMateria, Papirus, and original Breeze Dark from KDE.

build-base: core24
base: bare
grade: stable
confinement: strict
license: MIT
icon: snap/local/gruvbox-plus.png

platforms:
  amd64: 
    build-on: [amd64]
    build-for: all

slots:
  icon-themes:
    interface: content
    source:
      read:
        - $SNAP/share/icons/Gruvbox-Plus-Dark
        - $SNAP/share/icons/Gruvbox-Plus-Light

parts:
  icons:
    after:
      - utils
    plugin: dump
    source: "https://github.com/SylEleuth/gruvbox-plus-icon-pack/archive/refs/tags/$SNAPCRAFT_PROJECT_VERSION.tar.gz"
    override-build: |
        snapcraftctl build
        mkdir -p $SNAPCRAFT_PART_INSTALL/share/icons
        mv $SNAPCRAFT_PART_INSTALL/Numix* $SNAPCRAFT_PART_INSTALL/share/icons/
        $SNAPCRAFT_STAGE/update-icon-cache.sh $SNAPCRAFT_PART_INSTALL/share/icons
    stage:
      - share/icons/Gruvbox-Plus*

    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags | sed 's/^v//' | cut -d "-" -f1)"      
        
  utils:
    plugin: dump
    source: utils
    prime:
      - -*
    build-packages:
      - try: [gtk-update-icon-cache]
      - else: [libgtk-3-bin]
